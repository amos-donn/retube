<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0b0f">
    <title>ReTube</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; background: #0b0b0f; }
      iframe { display: block; width: 100%; height: 100%; border: 0; }
      noscript, .fallback { color: #fff; font: 16px system-ui, sans-serif; text-align: center; padding: 1rem; }
      .fallback a { color: #a78bfa; }
    </style>
  </head>
  <body>
    <iframe src="https://retube.lovable.app/" title="ReTube" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="eager"></iframe>
    <noscript class="fallback">JavaScript is required to view ReTube. <a href="https://retube.lovable.app/">Open ReTube directly</a>.</noscript>
  </body>
</html>
